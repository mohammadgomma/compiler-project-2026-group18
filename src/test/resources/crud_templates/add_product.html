<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f4f4f9; color: #333; }
        .form-container { background: white; padding: 2rem; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button.btn { background: #2ecc71; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
        button.btn:hover { background: #27ae60; }
        a { color: #3498db; text-decoration: none; margin-left: 1rem; }
    </style>
</head>
<body>
    <h1>Add New Product</h1>
    <div class="form-container">
        <form method="POST" action="/products/add">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" required />
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" name="price" required />
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description"></textarea>
            </div>
            <button type="submit" class="btn">Add Product</button>
            <a href="/products">Cancel</a>
        </form>
    </div>
</body>
</html>
